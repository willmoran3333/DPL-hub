# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Keep the copy light on names and figures — a player or two a side, no more.
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 9

matches:
  - home_roster_id: 3
    away_roster_id: 5
    headline: "The co-leader and the side that outscores him"
    body: >
      brendog2814 is 6-2 and sharing the lead, and he has been outscored by
      seven of the ten managers below him. His opponents have averaged
      the lowest score in the league by a distance; nobody else's schedule
      has been close to as kind. Flabiano9 is 4-4 with more points than the
      man across from him and has just posted the second-biggest score of
      GW8, with Cherki doing most of the damage. Rogers has carried the
      co-leader all season and will have to again. The model still gives
      brendog2814 the second-best title chance in the league, on the
      strength of the wins he has banked. This is the kind of week that
      decides whether that is a position or a head start.

  - home_roster_id: 4
    away_roster_id: 10
    headline: "The leader and the champion"
    body: >
      benditlikebergvall is top on wins, top on points and the model's clear
      favourite at better than one in three. He won again this week with his
      best defender of the gameweek sitting on the bench, which tells you
      how much margin he is working with. erozier is the defending champion
      and is 4-4, tenth on points, with a title chance the model rounds to
      one percent. Evanilson and Barry have kept him afloat; not much else
      has. A champion's season is usually decided by whether he can beat
      the side everyone else is chasing, and he gets his chance now.
