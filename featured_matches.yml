# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Keep the copy light on names and figures — a player or two a side, no more.
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 7

matches:
  - home_roster_id: 1
    away_roster_id: 7
    headline: "Top of the table and the team it has not played"
    body: >
      willmoran leads the league on points and sits in a four-way share of
      first. rmeernst is 3-3 and, against the whole field each week, has one
      of the best records in it. These two were not due to meet until GW12 under
      the old schedule; the fix brings them together now. The leader has not
      had a bad week yet, which is rarer than it sounds six games in, and the
      side across from him has spent the autumn scoring like a contender with
      nothing in the win column to show for it. Something gives.

  - home_roster_id: 5
    away_roster_id: 6
    headline: "The leader who has stopped scoring"
    body: >
      brendog2814 started four from four and still shares the lead, but he
      has lost two straight and both of them were the lowest scores of his
      season, back to back. Across from him is bjennings28, who against the
      whole field has the best record in the league and in the actual table
      is 2-4, having twice run straight into the week's top score. One of
      these teams is better than its record and one is worse, and this is the
      week the table starts to notice.
