# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Keep the copy light on names and figures — a player or two a side, no more.
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 10

matches:
  - home_roster_id: 4
    away_roster_id: 6
    headline: "The leader and the side with the most big weeks"
    body: >
      bjennings28 has posted the biggest score of the gameweek three times
      this season. Nobody else has done it more than once, and he is 4-5.
      The other six weeks explain it: three of them landed in the bottom
      four, and he has faced the second-hardest run of opponents in the
      league. Trafford and Bruno Fernandes have carried the good weeks.
      benditlikebergvall is 7-2, top on points, and the model's favourite
      at better than two in five. He won again this week with Haaland
      contributing almost nothing and his defenders covering for him. These
      two have met eight times across two seasons and the leader has won
      five. The question is which version of bjennings28 turns up.

  - home_roster_id: 2
    away_roster_id: 11
    headline: "Two 5-4 sides that are better than that"
    body: >
      Both of these managers are 5-4, and both have a record their scoring
      does not deserve. skoeiboy is third on points and won this week with
      Palmer, his best forward of the gameweek by a distance, sitting on the
      bench. mdropkin has the second-best all-play record in the league and
      is 5-4 because two of his nine weeks were his two worst, one of them
      the lowest score anyone but the winless side has posted all season.
      Rice and João Pedro have done most of his scoring. The model prefers
      skoeiboy on title chance, roughly one in fifteen to one in twenty-five,
      but there is not much between the rosters. A win here keeps one of
      them within sight of the leaders, with the points to back it up.
