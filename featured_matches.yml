# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 3

matches:
  - home_roster_id: 4
    away_roster_id: 5
    headline: "Two unbeatens, and only one way out"
    body: >
      benditlikebergvall and brendog2814 are the only teams still to lose, and
      they are separated by three points of scoring: 195.35 against 198.35.
      The difference is who they have played. brendog2814 has faced the two
      lowest totals of the season and conceded 93.00, the least in the league
      by 32 points; benditlikebergvall has already given up 157.20 and won
      both anyway. Erling Haaland and Kevin Schade are both home in GW3, City
      hosting Coventry and Brentford hosting Sunderland, while James Tarkowski
      gets Everton at home to United after his 21.00 in GW2. brendog2814's
      spread is the thinner one — Dominic Calvert-Lewin and Morgan Rogers both
      travel, to Brighton and to Arsenal. One of these records ends here.

  - home_roster_id: 2
    away_roster_id: 3
    headline: "The trade meets itself"
    body: >
      Three weeks ago Flabiano9 sent Youri Tielemans and 50 FAAB to skoeiboy
      for Sandro Tonali. In GW2 Tielemans returned 16.35 and Tonali 5.00, and
      now the two squads meet with both men on the pitch. Everything else about
      this pairing has run backwards as well: skoeiboy opened with 137.65, the
      biggest week of the season, then fell to 63.50; Flabiano9 opened with
      64.35, the second-worst, then put up 98.45. Both are 1–1. Rayan Cherki
      and Antoine Semenyo give Flabiano9 two City starters at home to Coventry,
      the softest fixture on the board, while skoeiboy leans on Cole Palmer at
      Arsenal and Anthony Elanga at home to Bournemouth. The 50 FAAB is gone
      either way. Only the eleven is still arguable.
