# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.

gw: 2

matches:
  - home_roster_id: 1
    away_roster_id: 2
    headline: "The 137 has to do it again"
    body: >
      skoeiboy drew the hardest possible follow-up: the league's high scorer
      against the manager who has the most reason to want a bounce. willmoran
      lost his opener 82.60–76.60 to mdropkin, the one man in the twelve with
      no DPL history, and did it with Isak returning 8.00 and Watkins still on
      the bench. Kiernan Dewsbury-Hall led that side with 18.00, which tells
      you the top end never arrived. Ice man's problem is different — De Cuyper
      and Emersonn were worth 50.00 between them in GW1, and neither is priced
      like that going forward.

  - home_roster_id: 6
    away_roster_id: 10
    headline: "Best loser meets the champion"
    body: >
      bjennings28 scored 100.90 in GW1, the second-highest total in the league,
      and lost by 36.75 because he ran into skoeiboy's week. Jack Hinshelwood
      went for 28.50 and James Trafford added 15.00 from goal. erozier begins
      the defence of his title with a narrower story: 79.40 past Flabiano9's
      64.35, Saka and Gvardiol carrying most of it. One of these two is 1-0 on
      merit and the other is 0-1 on the schedule.
