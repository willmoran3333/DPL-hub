# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.

gw: 1

matches:
  - home_roster_id: 10
    away_roster_id: 11
    headline: "The champion opens against the newcomer"
    body: >
      erozier begins the defence of a title he won with a squad that no
      longer exists — everyone redrafted in August. He took Saka at five
      and built out from there; mdropkin, the one manager in the league
      with no DPL history at all, went João Pedro at nine and drafted a
      roster that leans forward. First real read on both.

  - home_roster_id: 1
    away_roster_id: 7
    headline: "Isak leads the line against the Cunha plan"
    body: >
      willmoran spent back-to-back picks at 12 and 13 on Isak and Watkins,
      and starts the week with Isak up top and Watkins on the bench —
      already a selection call in GW1. rmeernst opened with Matheus Cunha
      and Morgan Gibbs-White. Two different shapes, no form guide.
