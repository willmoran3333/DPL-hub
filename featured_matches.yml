# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 2

matches:
  - home_roster_id: 7
    away_roster_id: 3
    headline: "Both of them lost to the bench"
    body: >
      rmeernst and Flabiano9 left more in reserve than anyone else in the
      league — 34.80 and 34.75, a twentieth of a point apart, and better than
      twenty times what skoeiboy wasted. For rmeernst it cost the game
      outright: 90.00 is the fifth-best total of the round and it lost
      95.05–90.00 to benditlikebergvall, with Ben White's 19.45 the ninth-best
      individual return of the week and still not enough. Flabiano9's trouble
      was the eleven itself. His 64.35 was the second-lowest score in the
      league, nobody beat Tarik Muharemovic's 11.20, and Youri Tielemans
      returned 0.00 before being shipped to skoeiboy for Sandro Tonali.

  - home_roster_id: 6
    away_roster_id: 10
    headline: "Best loser meets the champion"
    body: >
      bjennings28 scored 100.90 in GW1, the second-highest total in the league,
      and lost by 36.75 because he ran into skoeiboy's week. Jack Hinshelwood
      went for 27.35 and James Trafford added 15.00 from goal. erozier begins
      the defence of his title on far less: 79.40 past Flabiano9's 64.35, with
      Josko Gvardiol and Bukayo Saka worth 35.25 of it between them. The table
      says one of these two is 1-0 and the other 0-1. The scoreboard says the
      ninth-best total of the round is the one that won.
