# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Keep the copy light on names and figures — a player or two a side, no more.
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 5

matches:
  - home_roster_id: 2
    away_roster_id: 5
    headline: "The unbeaten and the unpredictable"
    body: >
      brendog2814 is the only team yet to lose and the only one to have passed
      140 in a week, and he arrives against the hardest side in the league to
      forecast. skoeiboy has already posted both the highest total of the
      season and one of the lowest, in consecutive rounds, and nothing in
      between has settled the question of which is the real one. Four weeks is
      not much to go on, but it is enough to say that one of these teams turns
      up every week and the other decides on the day. The unbeaten run has not
      met anything like this yet — every opponent so far has handed him a
      quiet afternoon.

  - home_roster_id: 10
    away_roster_id: 11
    headline: "The champion and the newcomer"
    body: >
      erozier won this league last season and has one win from four in this
      one. mdropkin had never played a week of it before August and has three.
      That is the whole fixture. The title defence has been undone less by bad
      luck than by bad weeks — he has been beaten on points by most of the
      field most rounds, and the record is an honest reflection for once.
      Across from him is a manager whose worst afternoon would be a good one
      for half the league. A win here puts the newcomer level with the leaders;
      a loss drops the champion to the bottom of the table and makes the rest
      of the autumn a salvage job.
