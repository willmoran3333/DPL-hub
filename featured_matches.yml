# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Keep the copy light on names and figures — a player or two a side, no more.
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 4

matches:
  - home_roster_id: 5
    away_roster_id: 8
    headline: "The unbeaten and the fortunate"
    body: >
      Both of these teams are near the top and only one of them belongs there.
      Score every side against the whole league each week rather than against
      the one opponent the schedule handed them, and brendog2814 comes out
      25-8 — the second-best team in the competition on merit. cstoney20 comes
      out 10-23. He has the eleventh-best scoring total of twelve and a winning
      record, which is a trick you can only pull for so long. His wins have
      been narrow and his opponents have been obliging; last week he got
      through by under two points. The unbeaten run meets the charmed one, and
      the schedule stops doing anyone any favours here.

  - home_roster_id: 7
    away_roster_id: 10
    headline: "All the points, none of the wins"
    body: >
      rmeernst has scored more than half the league and won nothing at all.
      Against the field each week he is a coin flip; in the table he is level
      with a team that has genuinely been outplayed every time out. Last week
      was the unkindest of the three — he had the single best individual return
      of the round in Tyrick Mitchell and still lost by under two points, with
      more than enough left on his bench to have covered it twice over. erozier
      arrives defending a title on one win from three and a record of his own
      that flatters him. Whoever loses this is properly adrift, and only one of
      them will be able to blame the fixtures.
