# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Keep the copy light on names and figures — a player or two a side, no more.
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 8

matches:
  - home_roster_id: 2
    away_roster_id: 4
    headline: "The two highest scorers in the league"
    body: >
      Nobody has scored more than benditlikebergvall this season, and
      skoeiboy is one of two managers within seven points of him. The table
      does not say so: one is 5-2 and sharing the lead, the other is 4-3 and a win back.
      They get there differently. The leader has finished in the top four in
      five of seven weeks and has just posted the high score of the gameweek.
      skoeiboy posted the biggest score of opening day and the second-biggest
      of GW7, and in the five weeks between, four scores in the sixties and
      seventies. One of them is a metronome; the other is a slot
      machine that has been paying out lately. Haaland against Palmer is the
      headline act, but the game will be decided by whichever side's
      defenders turn up.

  - home_roster_id: 1
    away_roster_id: 5
    headline: "Five-and-two meets five-and-two"
    body: >
      Two of the four managers sharing the lead, and a case study in how
      little a record tells you. willmoran has not had a bad week yet: never
      outside the top ten, top six in each of the last six, and one of the
      three best scoring sides in the league, carried by Groß and a Brighton
      defence that keeps producing. brendog2814 won his first four and has
      lost two of the last three, though a half-point escape in GW7 kept
      him level at the top. His opponents have scored less against him than
      anyone else's, by a distance. Rogers has carried him; the rest of the
      lineup has not been pulling its weight for a month. Same record, very
      different seasons, and only one of them keeps a share of first.
