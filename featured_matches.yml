# ─────────────────────────────────────────────────────────────────────────────
# FEATURED MATCHES  — two actual GW pairings to spotlight
# ─────────────────────────────────────────────────────────────────────────────
# Set `gw` to the upcoming gameweek and give each match the two roster_ids
# from that week's real pairings (the build script verifies them against
# matchup_legs and flags any that don't line up). Rewrite the copy weekly.
#
# Keep the copy light on names and figures — a player or two a side, no more.
# Player figures here are scored under the league's own scoring_settings, not
# the pts_std column — the two differ for most players and pts_std does not
# reconcile to the team totals in matchup_legs.

gw: 6

matches:
  - home_roster_id: 5
    away_roster_id: 10
    headline: "The first loss and the champion"
    body: >
      brendog2814 was unbeaten until last week, when he posted the lowest
      score of his season and lost for the first time. He now shares the top
      of the table instead of owning it. The team waiting for him is the
      defending champion, who has spent five weeks looking nothing like one
      and then won by sixty. One of them is coming off his worst week and the
      other off his most convincing, and the table has them two wins apart. A second defeat here and the early lead is gone entirely.

  - home_roster_id: 4
    away_roster_id: 11
    headline: "The co-leader and the newcomer"
    body: >
      benditlikebergvall has quietly drawn level at the top, with four wins
      and none of the noise that came with the other 4-1 team. Across from him
      is mdropkin, the league's one new manager, who went four weeks without
      a bad score and then had the worst one anybody recorded last round. That
      was either a blip or the start of the season catching up with him, and
      this is the fixture that says which. A win keeps the newcomer in the
      leading group; a loss leaves the co-leader clear of it.
