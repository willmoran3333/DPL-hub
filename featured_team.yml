roster_id: 11
gw: 0
headline: "A new name in the twelve"
subheadline: "mdropkin takes slot 11 and builds Kurt Zouma's Kittens off the ninth pick"
body: >
  The only change to the DPL roll call for 2026/27 is at slot 11, where
  mdropkin comes in for jacklynch213. In a redraft league that matters less
  than it might elsewhere — all twelve rosters went back in the box in
  August and every manager built again from nothing, so the new man is
  level on assets and behind only on history. He drew the ninth pick, spent
  it on João Pedro, and doubled back for Declan Rice at 16. From there he
  leaned Arsenal: Havertz, Tzolis and David Raya all landed on the same
  roster, with Raya the eighth-round answer in goal. The shape that came
  out of it is forward-loaded — seven up top, five at the back, four in
  midfield — and it gets tested immediately. GW1 pairs him with erozier,
  who won the thing last year.

