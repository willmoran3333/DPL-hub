roster_id: 2
gw: 1
headline: "137.65, and almost none of it was drafted"
subheadline: "skoeiboy opens with the biggest week of his DPL career — built on a 7-unit waiver bid and a free agent"
body: >
  skoeiboy put 137.65 on the board in GW1 and won by 36.75 over bjennings28,
  who scored 100.90 and still lost. Five of the twelve highest-scoring
  starters in the league were his: Cole Palmer 31.00, Maxim De Cuyper 28.00,
  Emersonn 22.00, Martin Ødegaard 20.00, Keane Lewis-Potter 18.50. The two
  in the middle of that list are the point. De Cuyper cost a 7-unit waiver
  bid the week before a ball was kicked; Emersonn cost nothing at all, a
  free-agent add nobody else moved on. Together they returned 50.00 — more
  than a third of the total, from two players who were not on the roster on
  draft night. The rest of it was clean rather than lucky: 2.00 points left
  on the bench, the lowest figure in the league, with every start that
  mattered getting the nod. For context on the number itself, his previous
  best raw week in three DPL seasons was 129.50, back in GW23 of 2024. Only
  the commissioner-adjusted 141.00 from GW31 last year sits above this one.

highlight_stats:
  - label: "GW1 Score"
    value: "137.65"
  - label: "Margin"
