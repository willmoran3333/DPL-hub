roster_id: 6
gw: 6
headline: "The Best Team in the League Is 2-3"
subheadline: "bjennings28 has outscored nearly everyone, nearly every week, and has a losing record to show for it"
body: |
  Put every team up against the whole league each week, rather than the one
  opponent the schedule hands out, and bjennings28 comes out 40-15. Nobody
  else is close. In the actual table he is seventh.

  The explanation is not complicated. Twice in five weeks he has run into the
  highest score anybody posted that round, and both times he was the one
  standing across from it. That is the whole difference between his record
  and the leaders'. He has scored like a contender in four weeks of five and
  been handed a loss for three of them.

  The one honest blemish was last week, his first real off day, and it came
  against a side having the game of its season. The schedule owes him, and
  over thirty-three more weeks it tends to pay.

