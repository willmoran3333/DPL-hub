show: true

roster_id: 9
gw: 7
headline: "The Turnaround"
subheadline: "JordiCarb opened the season with a score in the thirties and has just posted the best week of his year"
body: |
  Five weeks ago he was the cautionary tale: a first-week total in the
  thirties, one of the three lowest anyone has posted, and a 1-3 start that
  looked like the shape of the year. He has won three of the last four, and
  the most recent was a 119-point week, comfortably his best and among the
  handful of biggest scores the league has seen.

  It is not a fluke of the fixture list. Against the whole field each week
  he has gone from the bottom three to the middle of the pack, and his last
  two scores would have won almost any matchup on the schedule. The team
  that showed up in September and the team that showed up this week are not
  obviously the same team.

  He is level on wins with five other managers and one behind the leaders,
  and in a league this bunched a run like his moves a side half the table in
  a month. Whether it holds is the question of the autumn.

