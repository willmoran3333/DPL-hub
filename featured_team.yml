# Set show: false to hide the featured-manager block on the home page.
show: true

roster_id: 1
gw: 10
headline: "Second on Points, Ninth in the Model"
subheadline: "willmoran has the second-best record and the second-most points in the league, and a roster the model does not believe in"
body: |
  Nine weeks in, he is 6-3 and only the leader has outscored him. He has
  done it without a signature week. This gameweek's 104.70 was the second
  biggest score in the league and the first time all season he has finished
  a week in the top three; six of his nine have landed between fourth and
  sixth. Nobody has been that steady. Both of the sides above him have had
  a week in the bottom four, and he has only had two.

  The roster that is doing it is not the one he drafted. Three of his first
  four picks are nowhere near his six best scorers, and his best player by a
  distance is Groß, taken in the sixth round. This week his three highest
  starters were all waiver pickups, with Rudoni leading, while his first
  round pick contributed four points. The side has been rebuilt on the fly
  and it has not cost him a beat.

  The model is unmoved. It rates his roster ninth of twelve on strength and
  gives him a title chance a shade over one in thirty, behind five managers
  below him in the table. The all-play record says otherwise: scored against
  the whole field every week he is 58-40, third best in the league. One of
  the two is going to be wrong about him, and the next few weeks will say
  which.

