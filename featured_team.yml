roster_id: 11
gw: 0
headline: "A new name in the twelve"
subheadline: "mdropkin takes over slot 11 and drafts Kurt Zouma's Kittens from scratch"
body: >
  The only change to the DPL roll call for 2026/27 is at slot 11, where
  mdropkin replaces jacklynch213 and inherits nothing — no keepers, no
  carry-over, just the ninth pick and seventeen rounds to build with. He
  spent that first pick on João Pedro and doubled back for Declan Rice at
  16, then went heavy on Arsenal: Havertz, Tzolis and David Raya all landed
  on the same roster, with Raya the eighth-round answer in goal. The shape
  that came out of it is forward-loaded — seven up top, five at the back,
  four in midfield — and it gets tested immediately. GW1 pairs him with
  erozier, who won the thing last year.

