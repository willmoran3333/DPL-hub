roster_id: 2
gw: 1
headline: "The Week of Sam"
subheadline: "skoeiboy opens with the second-biggest week of his DPL career — built on two players he picked up after the draft"
body: |
  skoeiboy put 137.65 on the board in GW1 and won by 36.75 over bjennings28,
  who scored 100.90 and still lost. Four of the twelve highest-scoring
  starters in the league were his — Cole Palmer 30.05, Maxim De Cuyper 24.00,
  Emersonn 22.80, Martin Ødegaard 19.00 — with Keane Lewis-Potter 17.60 just
  outside in 13th.

  The biggest surprise of all? De Cuyper and Emersonn. Together they returned
  46.80, all from the waiver wire. The rest of it was clean rather than lucky:
  1.55 points left on the bench, the lowest figure in the league, with every
  start that mattered getting the nod.

