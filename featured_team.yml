headline: "Three and Oh, on Hull City Defenders"
subheadline: "brendog2814 is the last unbeaten team in the league, and the fourth-highest scorer in it"
body: |
  The squad reads like a relegation six-pointer. Ryan Giles and Semi Ajayi of
  Hull, James Hill and Alex Scott of Bournemouth, Anan Khalaili of Palace.
  Dominik Szoboszlai's 18.00 was the only return in his GW3 eleven that would
  have made the top eight starters of the round. He scored 88.30, which was
  fourth-best on the day, and he is 3-0.

  What he does better than anyone is name the right eleven. His bench cost him
  2.10 in GW3, the lowest figure in the league; benditlikebergvall, the man
  across from him in the same fixture, left 43.30 in reserve including Josh
  King's 18.15. That was the whole margin and more. Over three weeks nobody
  has wasted less.

  The asterisk is who he has played. He has conceded 158.25, the least in the
  league by 56.65 — his three opponents have posted 35.65, 57.35 and 65.25,
  and two of those are the worst totals anyone has recorded all season. But
  the schedule is not the whole of it: on an all-play basis, where every team
  is scored against all eleven others each week, he is 25-8. Only bjennings28
  is better, at 32-1 — and bjennings28 is 2-1, because the one time he lost he
  ran into the biggest week of the season. Two teams here are better than
  their record. Only one of them is also winning.

