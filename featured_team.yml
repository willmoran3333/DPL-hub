show: true

roster_id: 7
gw: 9
headline: "Four-and-Four, Second on Points"
subheadline: "rmeernst has the second-best scoring side in the league and a record that says mid-table"
body: |
  Eight weeks in, only the leader has scored more than he has. The table
  has him seventh, level on wins with four other managers, and the gap
  between those two facts is the whole story of his autumn. Two of his four
  losses came by less than a goal's worth of points. Swap either one and he
  is sharing the lead; swap both and he is clear of it.

  The scoring is not a fluke of one hot week. He has never had the biggest
  score of a gameweek and never the smallest, and he has not finished
  outside the top nine once. Tavernier, a midfielder nobody was fighting
  over in August, has been his best player by a distance, and this week he
  beat mdropkin by a point with his first two draft picks both sitting on
  the bench.

  The model sees what the table does not. It rates his roster the second
  strongest in the league, a whisker behind the leader, and gives him a
  better title chance than half the managers above him in the table. He has
  thirty weeks to make the record catch up with the points.

