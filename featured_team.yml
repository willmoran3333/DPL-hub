roster_id: 10
gw: 10
headline: "The Champion Has Not Hit 100"
subheadline: "erozier won the league on 3,535 points last season; nine weeks into the defence, the big weeks have not arrived"
body: |
  Last season he ran away with it: 25 wins, more points than anyone else by
  over 250, and a 150-point week along the way. Nine weeks into the
  defence he is 4-5 and tenth on points, and the striking thing is not the
  bad weeks but the absence of good ones. His best score of the season is
  98.20. He and the winless side are the only two managers without a
  100-point week, and the gap between his best and his worst is 31 points,
  the narrowest in the league by a distance.

  The wins tell the same story. All four came against an opponent who
  scored under 65, and he has lost every week the man across from him
  cleared 87. Barry and Evanilson have been excellent up front; the draft
  has not helped much behind them. His second and third picks have 28
  points between them across nine weeks, and the third-rounder started
  this week and finished below zero.

  The model has him tenth on roster strength, a title chance around one in
  eighty, and a one-in-ten chance of finishing last, worse than anyone but
  the winless side. His opponents have averaged the third-lowest score in
  the league, so the schedule has been doing him favours. The floor is
  fine. The title was won on the ceiling, and it has not shown up yet.

